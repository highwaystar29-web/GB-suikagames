<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GB SUIKA</title>
<style>
  :root{
    --c0:#0f380f; /* darkest */
    --c1:#306230;
    --c2:#8bac0f;
    --c3:#9bbc0f; /* lightest */
  }
  html,body{
    margin:0; height:100%;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier New', 'Consolas', monospace;
    font-weight:bold;
    color:var(--c3);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
    overflow:hidden;
  }
  #shell{
    background:var(--c1);
    padding:18px;
    border-radius:14px;
    box-shadow:0 0 0 4px #1a1a1a, 0 10px 30px rgba(0,0,0,0.6);
    max-width:96vw;
    max-height:96vh;
    box-sizing:border-box;
  }
  #screen{
    background:var(--c3);
    border:6px solid var(--c0);
    border-radius:4px;
    position:relative;
    image-rendering:pixelated;
    overflow:hidden;
  }
  canvas{
    display:block;
    image-rendering:pixelated;
  }
  #game{
    max-width:100%;
    height:auto;
  }
  #hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 4px 12px 4px;
    font-size:9px;
    color:var(--c0);
  }
  #hud .box{
    background:var(--c2);
    border:2px solid var(--c0);
    padding:4px 6px;
    line-height:1.6;
  }
  #nextLabel{ text-align:right; }
  #overlay{
    position:absolute; inset:0;
    background:rgba(15,56,15,0.85);
    color:var(--c3);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:11px;
    gap:14px;
    padding:10px;
  }
  #overlay button{
    font-family:'Courier New', 'Consolas', monospace;
    font-weight:bold;
    background:var(--c2);
    color:var(--c0);
    border:3px solid var(--c0);
    padding:8px 14px;
    font-size:10px;
    cursor:pointer;
  }
  #overlay button:active{ transform:translateY(2px); }
  #hint{
    text-align:center;
    font-size:8px;
    color:var(--c0);
    opacity:0.7;
    margin-top:10px;
    letter-spacing:1px;
  }
</style>
</head>
<body>
<div id="shell">
  <div id="hud">
    <div class="box">SCORE<br><span id="scoreVal">0000</span></div>
    <div class="box" id="nextLabel">NEXT<br><canvas id="nextIcon" width="28" height="28" style="vertical-align:middle;image-rendering:pixelated;"></canvas></div>
  </div>
  <div id="screen">
    <canvas id="game" width="320" height="288"></canvas>
    <div id="overlay">
      <div>GAME OVER</div>
      <div id="finalScore" style="font-size:9px;"></div>
      <button id="retryBtn">RETRY</button>
    </div>
  </div>
  <div id="hint">HOLD TO AIM, RELEASE TO DROP<br>OR ←→ + SPACE</div>
</div>

<script>
(function(){
  // ================= DOM =================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('scoreVal');
  const nextIconCanvas = document.getElementById('nextIcon');
  const nextIconCtx = nextIconCanvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('finalScore');
  const retryBtn = document.getElementById('retryBtn');

  // ================= PALETTE / SHADING =================
  const PAL = ['#0f380f','#306230','#8bac0f','#9bbc0f']; // darkest -> lightest

  const ditherPatterns = [
    [[1,0],[0,0]], // sparse
    [[1,0],[0,1]], // checker
    [[1,1],[0,1]], // dense
    [[1,1],[1,1]], // solid
  ];

  // ================= PRODUCE TIERS (matches the reference chart) =================
  const TIERS = [
    { r:8,  tone:0, name:'ドングリ',     shape:'acorn' },
    { r:11, tone:1, name:'栗',          shape:'chestnut' },
    { r:15, tone:0, name:'クルミ',       shape:'walnut' },
    { r:19, tone:2, name:'銀杏',        shape:'ginkgo' },
    { r:24, tone:1, name:'落花生',      shape:'peanut' },
    { r:30, tone:3, name:'さつまいも',   shape:'sweetpotato' },
    { r:37, tone:0, name:'じゃがいも',   shape:'potato' },
    { r:45, tone:2, name:'かぼちゃ',     shape:'pumpkin' },
    { r:54, tone:1, name:'キャベツ',     shape:'cabbage' },
    { r:64, tone:3, name:'とうもろこし', shape:'corn' },
    { r:76, tone:2, name:'巨大カボチャ', shape:'giantpumpkin' },
  ];

  // ================= TUNABLE PHYSICS CONFIG =================
  const GRAVITY        = 0.42;   // fall acceleration per frame
  const WALL_L          = 76, WALL_R = W-76, FLOOR = H-10; // narrow, jar-like play field
  const JAR_CORNER      = 22; // rounded bottom-corner radius, for a glass-jar silhouette
  const DROP_Y          = 30;
  const GAMEOVER_LINE   = 40;

  const AIR_DRAG_Y      = 0.98;  // vertical damping per frame
  const AIR_DRAG_X      = 0.82;  // horizontal damping per frame (friction-like)
  const WALL_BOUNCE     = 0.08;  // how much horizontal speed survives a wall hit
  const FLOOR_BOUNCE    = 0.05;  // how much vertical speed survives a floor hit
  const REST_EPS        = 0.06;  // velocities below this are snapped to 0

  const SOLVER_ITERATIONS = 6;         // overlap-resolution passes per frame
  const OVERLAP_TARGET    = 0.82;      // pieces are allowed to rest this "close" (of minDist) so
                                        // touching artwork looks snug instead of leaving a gap
  const OVERLAP_CORRECT   = 0.45;      // how much of the overlap is corrected per pass
  const CONTACT_DAMP_VX   = 0.82;      // extra damping applied on contact (kills jitter)
  const CONTACT_DAMP_VY   = 0.9;
  const CONTACT_BOUNCE    = 0.02;      // tiny restitution on contact

  const ROLL_FACTOR  = 0.22; // how strongly horizontal speed turns into visual spin
  const ROLL_DECAY   = 0.97; // spin eases back toward upright each frame

  const GAMEOVER_GRACE_FRAMES = 40; // must rest above the line this long before it's over

  // ================= STATE =================
  let bodies = [];
  let score = 0;
  let dropX = W/2;
  let currentTier = 0;
  let nextTier = 0;
  let canDrop = true;
  let over = false;
  let dangerTimer = 0;
  let aiming = false;

  function randTier(){
    // early game favors the smallest few pieces
    return Math.floor(Math.random()*4);
  }

  function newFallingTier(){
    currentTier = nextTier;
    nextTier = randTier();
    drawNextIcon();
  }

  function drawNextIcon(){
    nextIconCtx.clearRect(0,0,28,28);
    const t = TIERS[nextTier];
    const scale = Math.min(1, 10/t.r);
    nextIconCtx.save();
    nextIconCtx.translate(14,15);
    nextIconCtx.scale(scale,scale);
    drawProduce(0,0,t.r,nextTier,nextIconCtx);
    nextIconCtx.restore();
  }

  function addBody(x,y,tier,vy){
    bodies.push({
      x,y,tier,
      vx:0, vy: vy||0,
      angle:0,
      id: Math.random()
    });
  }

  function resetGame(){
    bodies = [];
    score = 0;
    scoreEl.textContent = '0000';
    dropX = W/2;
    over = false;
    dangerTimer = 0;
    canDrop = true;
    aiming = false;
    nextTier = randTier();
    newFallingTier();
    overlay.style.display = 'none';
  }

  // ================= INPUT: hold to aim, release to drop =================
  function pointerX(clientX){
    const rect = canvas.getBoundingClientRect();
    const scale = W / rect.width;
    return (clientX - rect.left) * scale;
  }
  function clampDropX(x){
    const r = TIERS[currentTier].r;
    return Math.max(WALL_L+r, Math.min(WALL_R-r, x));
  }
  function startAim(x){
    if(!canDrop || over) return;
    aiming = true;
    dropX = clampDropX(x);
  }
  function updateAim(x){
    if(!aiming) return;
    dropX = clampDropX(x);
  }
  function releaseAim(){
    if(!aiming) return;
    aiming = false;
    doDrop();
  }
  function doDrop(){
    if(!canDrop || over) return;
    canDrop = false;
    addBody(dropX, DROP_Y, currentTier, 0);
    setTimeout(()=>{
      canDrop = true;
      newFallingTier();
    }, 420);
  }

  canvas.addEventListener('mousedown', e=> startAim(pointerX(e.clientX)));
  window.addEventListener('mousemove', e=> updateAim(pointerX(e.clientX)));
  window.addEventListener('mouseup', ()=> releaseAim());

  canvas.addEventListener('touchstart', e=>{
    const t = e.touches && e.touches[0];
    if(!t) return;
    startAim(pointerX(t.clientX));
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchmove', e=>{
    const t = e.touches && e.touches[0];
    if(!t) return;
    updateAim(pointerX(t.clientX));
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchend', e=>{
    releaseAim();
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchcancel', ()=>{ aiming = false; });

  window.addEventListener('keydown', e=>{
    if(over) return;
    if(e.key==='ArrowLeft') dropX = clampDropX(dropX-8);
    if(e.key==='ArrowRight') dropX = clampDropX(dropX+8);
    if(e.key===' '||e.key==='ArrowDown') doDrop();
  });

  retryBtn.addEventListener('click', resetGame);

  // ================= PHYSICS =================
  function integrate(){
    for(const b of bodies){
      b.vy += GRAVITY;
      b.vy *= AIR_DRAG_Y;
      b.vx *= AIR_DRAG_X;
      b.x += b.vx;
      b.y += b.vy;

      const r = TIERS[b.tier].r;
      if(b.x - r < WALL_L){ b.x = WALL_L+r; b.vx *= -WALL_BOUNCE; }
      if(b.x + r > WALL_R){ b.x = WALL_R-r; b.vx *= -WALL_BOUNCE; }
      if(b.y + r > FLOOR){
        b.y = FLOOR-r;
        b.vy *= -FLOOR_BOUNCE;
        if(Math.abs(b.vy) < 1.0) b.vy = 0;
      }
      if(Math.abs(b.vx) < REST_EPS) b.vx = 0;
      if(Math.abs(b.vy) < REST_EPS) b.vy = 0;

      // subtle rolling: a small tilt that follows horizontal speed, then eases
      // back upright so hand-drawn (non-circular) artwork never drifts far
      // from the underlying circular hitbox
      b.angle = (b.angle||0) + (b.vx / r) * ROLL_FACTOR;
      b.angle *= ROLL_DECAY;
    }
  }

  const mergeQueue = [];

  function resolveCollisions(){
    for(let pass=0; pass<SOLVER_ITERATIONS; pass++){
      for(let i=0;i<bodies.length;i++){
        for(let j=i+1;j<bodies.length;j++){
          const a = bodies[i], b = bodies[j];
          if(!a || !b) continue;
          const ra = TIERS[a.tier].r, rb = TIERS[b.tier].r;
          const dx = b.x-a.x, dy = b.y-a.y;
          const dist = Math.sqrt(dx*dx+dy*dy) || 0.0001;
          const minDist = ra+rb;
          if(dist >= minDist) continue;

          if(a.tier === b.tier && a.merging===undefined && b.merging===undefined && pass===0){
            a.merging = true; b.merging = true;
            mergeQueue.push({a,b});
            continue;
          }

          const restDist = minDist*OVERLAP_TARGET; // pieces are allowed to sit this close
          if(dist >= restDist) continue;

          const overlap = restDist - dist;
          const nx = dx/dist, ny = dy/dist;
          const push = overlap*OVERLAP_CORRECT;

          // heavier (bigger) piece barely moves; the lighter one yields -
          // this is what stops a big piece from being "floated" by a pile
          // of small ones underneath it
          const massA = ra*ra, massB = rb*rb;
          const shareA = massB/(massA+massB), shareB = massA/(massA+massB);

          a.x -= nx*push*shareA; a.y -= ny*push*shareA;
          b.x += nx*push*shareB; b.y += ny*push*shareB;

          const relvx = b.vx-a.vx, relvy = b.vy-a.vy;
          const rel = relvx*nx + relvy*ny;
          if(rel < 0){
            a.vx -= nx*rel*CONTACT_BOUNCE*shareA; a.vy -= ny*rel*CONTACT_BOUNCE*shareA;
            b.vx += nx*rel*CONTACT_BOUNCE*shareB; b.vy += ny*rel*CONTACT_BOUNCE*shareB;
          }
          a.vx *= CONTACT_DAMP_VX; b.vx *= CONTACT_DAMP_VX;
          a.vy *= CONTACT_DAMP_VY; b.vy *= CONTACT_DAMP_VY;
        }
      }
      // re-clamp to floor/walls every pass so a push never lifts a body off the floor
      for(const b of bodies){
        const r = TIERS[b.tier].r;
        if(b.y + r > FLOOR){ b.y = FLOOR-r; if(b.vy>0) b.vy = 0; }
        if(b.x - r < WALL_L) b.x = WALL_L+r;
        if(b.x + r > WALL_R) b.x = WALL_R-r;
      }
    }
  }

  function processMerges(){
    for(const m of mergeQueue){
      const {a,b} = m;
      if(a.dead || b.dead) continue;
      const nextTierIdx = Math.min(a.tier+1, TIERS.length-1);
      const grew = a.tier < TIERS.length-1;
      a.dead = true; b.dead = true;
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      if(grew){
        addBody(mx, my, nextTierIdx, -2);
        score += (nextTierIdx+1)*10;
      } else {
        score += 100;
      }
      scoreEl.textContent = String(score).padStart(4,'0');
    }
    mergeQueue.length = 0;
    bodies = bodies.filter(b=>!b.dead);
  }

  function checkGameOver(){
    let danger = false;
    for(const b of bodies){
      const r = TIERS[b.tier].r;
      if(b.y - r < GAMEOVER_LINE && Math.abs(b.vy) < 1.2){
        danger = true;
        break;
      }
    }
    if(danger){
      dangerTimer++;
      if(dangerTimer > GAMEOVER_GRACE_FRAMES) triggerGameOver();
    } else {
      dangerTimer = Math.max(0, dangerTimer-2);
    }
  }

  function triggerGameOver(){
    over = true;
    finalScoreEl.textContent = 'SCORE ' + String(score).padStart(4,'0');
    overlay.style.display = 'flex';
  }

  function step(){
    integrate();
    resolveCollisions();
    processMerges();
    checkGameOver();
  }

  // ================= RENDERING (GB-style dithered shading) =================
  function fillEllipseDithered(g,cx,cy,rx,ry,tone){
    const pattern = ditherPatterns[tone];
    const dark = PAL[Math.max(0,tone-1)];
    const light = PAL[tone];
    g.save();
    g.beginPath();
    g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    g.clip();
    g.fillStyle = light;
    g.fillRect(cx-rx,cy-ry,rx*2,ry*2);
    g.fillStyle = dark;
    const step = 2;
    for(let y=-ry;y<ry;y+=step){
      for(let x=-rx;x<rx;x+=step){
        const px = Math.floor((x+rx)/step)%2;
        const py = Math.floor((y+ry)/step)%2;
        if(pattern[py][px]) g.fillRect(cx+x,cy+y,step,step);
      }
    }
    // soft shadow, lower-right (sparse dark dither for a gradient feel)
    g.fillStyle = PAL[0];
    for(let y=-ry;y<ry;y+=step){
      for(let x=-rx;x<rx;x+=step){
        if(x > -rx*0.05 && y > -ry*0.05){
          const px = Math.floor((x+rx)/step)%2;
          const py = Math.floor((y+ry)/step)%2;
          if((px+py)%2===0) g.fillRect(cx+x,cy+y,step,step);
        }
      }
    }
    // solid highlight blob, upper-left (rounded, glossy feel)
    g.fillStyle = PAL[3];
    g.beginPath();
    g.ellipse(cx-rx*0.32, cy-ry*0.32, rx*0.28, ry*0.24, 0, 0, Math.PI*2);
    g.fill();
    g.restore();
    g.strokeStyle = PAL[0];
    g.lineWidth = Math.max(1, Math.min(rx,ry)*0.08);
    g.beginPath();
    g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    g.stroke();
  }

  function fillPathDithered(g,tone,pathFn,bx,by,bw,bh){
    const pattern = ditherPatterns[tone];
    const dark = PAL[Math.max(0,tone-1)];
    const light = PAL[tone];
    const cx = bx+bw/2, cy = by+bh/2;
    g.save();
    pathFn();
    g.clip();
    g.fillStyle = light;
    g.fillRect(bx,by,bw,bh);
    g.fillStyle = dark;
    const step = 2;
    for(let y=by;y<by+bh;y+=step){
      for(let x=bx;x<bx+bw;x+=step){
        const px = Math.floor((x-bx)/step)%2;
        const py = Math.floor((y-by)/step)%2;
        if(pattern[py][px]) g.fillRect(x,y,step,step);
      }
    }
    g.fillStyle = PAL[0];
    for(let y=by;y<by+bh;y+=step){
      for(let x=bx;x<bx+bw;x+=step){
        if(x > cx-bw*0.05 && y > cy-bh*0.05){
          const px = Math.floor((x-bx)/step)%2;
          const py = Math.floor((y-by)/step)%2;
          if((px+py)%2===0) g.fillRect(x,y,step,step);
        }
      }
    }
    g.fillStyle = PAL[3];
    g.beginPath();
    g.ellipse(cx-bw*0.16, cy-bh*0.16, bw*0.14, bh*0.12, 0, 0, Math.PI*2);
    g.fill();
    g.restore();
    g.strokeStyle = PAL[0];
    g.lineWidth = Math.max(1, bw*0.045);
    pathFn();
    g.stroke();
  }

  // draws a produce-themed sprite whose silhouette matches the reference
  // illustration, shaded with the 4-tone GB dither. All coordinates below
  // are local to (0,0) since the caller translates/rotates first.
  function drawProduce(cx,cy,r,tier,g,angle){
    g = g || ctx;
    const t = TIERS[tier];
    const tone = t.tone;
    g.save();
    g.translate(cx,cy);
    if(angle) g.rotate(angle);
    cx = 0; cy = 0;

    switch(t.shape){
      case 'acorn': {
        fillEllipseDithered(g, cx, cy+r*0.2, r*0.68, r*0.78, tone);
        g.fillStyle = PAL[0];
        g.beginPath();
        g.ellipse(cx, cy-r*0.52, r*0.8, r*0.44, 0, 0, Math.PI*2);
        g.fill();
        g.strokeStyle = PAL[1];
        g.lineWidth = Math.max(1, r*0.06);
        for(let i=-2;i<=2;i++){
          g.beginPath();
          g.moveTo(cx+i*r*0.16, cy-r*0.78);
          g.lineTo(cx+i*r*0.16, cy-r*0.36);
          g.stroke();
        }
        g.fillStyle = PAL[0];
        g.fillRect(cx-r*0.07, cy-r*1.02, r*0.14, r*0.24);
        g.fillStyle = PAL[3];
        g.beginPath();
        g.ellipse(cx-r*0.2, cy+r*0.1, r*0.16, r*0.24, -0.4, 0, Math.PI*2);
        g.fill();
        break;
      }
      case 'chestnut': {
        fillEllipseDithered(g, cx, cy+r*0.08, r*0.72, r*0.85, tone);
        g.fillStyle = PAL[3];
        g.beginPath();
        g.ellipse(cx, cy-r*0.55, r*0.26, r*0.18, 0, 0, Math.PI*2);
        g.fill();
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.05);
        g.stroke();
        break;
      }
      case 'walnut': {
        fillEllipseDithered(g, cx, cy, r*0.88, r*0.88, tone);
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.09);
        g.beginPath();
        g.moveTo(cx, cy-r*0.8);
        g.quadraticCurveTo(cx-r*0.28, cy-r*0.28, cx, cy);
        g.quadraticCurveTo(cx+r*0.28, cy+r*0.28, cx, cy+r*0.8);
        g.stroke();
        g.lineWidth = Math.max(1, r*0.06);
        [[-0.4,-0.35,-0.12,-0.15],[0.4,-0.35,0.12,-0.15],[-0.4,0.35,-0.12,0.15],[0.4,0.35,0.12,0.15]].forEach(([x1,y1,x2,y2])=>{
          g.beginPath();
          g.moveTo(cx+x1*r, cy+y1*r);
          g.lineTo(cx+x2*r, cy+y2*r);
          g.stroke();
        });
        break;
      }
      case 'ginkgo': {
        const pathFn = ()=>{
          g.beginPath();
          g.moveTo(cx, cy-r*0.95);
          g.quadraticCurveTo(cx+r*0.6, cy-r*0.45, cx+r*0.4, cy+r*0.55);
          g.quadraticCurveTo(cx, cy+r*0.95, cx-r*0.4, cy+r*0.55);
          g.quadraticCurveTo(cx-r*0.6, cy-r*0.45, cx, cy-r*0.95);
          g.closePath();
        };
        fillPathDithered(g, tone, pathFn, cx-r, cy-r, r*2, r*2);
        g.strokeStyle = PAL[1];
        g.lineWidth = Math.max(1, r*0.05);
        g.beginPath();
        g.moveTo(cx, cy-r*0.7);
        g.lineTo(cx, cy+r*0.7);
        g.stroke();
        break;
      }
      case 'peanut': {
        fillEllipseDithered(g, cx, cy-r*0.42, r*0.55, r*0.58, tone);
        fillEllipseDithered(g, cx, cy+r*0.42, r*0.55, r*0.58, tone);
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.1);
        g.beginPath();
        g.moveTo(cx-r*0.32, cy-r*0.06);
        g.quadraticCurveTo(cx, cy-r*0.18, cx+r*0.32, cy-r*0.06);
        g.moveTo(cx-r*0.32, cy+r*0.06);
        g.quadraticCurveTo(cx, cy+r*0.18, cx+r*0.32, cy+r*0.06);
        g.stroke();
        g.fillStyle = PAL[0];
        [[-0.28,-0.55],[0.28,-0.55],[-0.28,0.55],[0.28,0.55]].forEach(([ox,oy])=>{
          g.beginPath();
          g.arc(cx+ox*r, cy+oy*r, r*0.07, 0, Math.PI*2);
          g.fill();
        });
        break;
      }
      case 'sweetpotato': {
        const ang = 0.35;
        const pathFn = ()=>{
          g.beginPath();
          g.ellipse(cx, cy, r*0.5, r*1.0, ang, 0, Math.PI*2);
        };
        fillPathDithered(g, tone, pathFn, cx-r, cy-r, r*2, r*2);
        g.fillStyle = PAL[0];
        [[-0.15,-0.45],[0.22,0.15],[-0.05,0.5]].forEach(([ox,oy])=>{
          g.beginPath();
          g.ellipse(cx+ox*r, cy+oy*r, r*0.12, r*0.06, ang, 0, Math.PI*2);
          g.fill();
        });
        g.fillStyle = PAL[3];
        g.beginPath();
        g.ellipse(cx-r*0.18, cy-r*0.35, r*0.1, r*0.28, ang, 0, Math.PI*2);
        g.fill();
        break;
      }
      case 'potato': {
        const pathFn = ()=>{
          g.beginPath();
          g.ellipse(cx, cy, r*0.85, r*0.72, 0.15, 0, Math.PI*2);
        };
        fillPathDithered(g, tone, pathFn, cx-r, cy-r, r*2, r*2);
        g.fillStyle = PAL[0];
        [[-0.3,-0.2],[0.2,0.1],[-0.05,0.35],[0.35,-0.25]].forEach(([ox,oy])=>{
          g.beginPath();
          g.arc(cx+ox*r, cy+oy*r, r*0.08, 0, Math.PI*2);
          g.fill();
        });
        break;
      }
      case 'pumpkin': {
        fillEllipseDithered(g, cx, cy, r*0.96, r*0.82, tone);
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.05);
        for(let k=-2;k<=2;k++){
          g.beginPath();
          g.ellipse(cx, cy, Math.abs(k)*r*0.16+r*0.1, r*0.8, 0, 0, Math.PI*2);
          g.stroke();
        }
        g.fillStyle = PAL[0];
        g.fillRect(cx-r*0.08, cy-r*1.0, r*0.16, r*0.28);
        g.strokeStyle = PAL[1];
        g.lineWidth = Math.max(1, r*0.06);
        g.beginPath();
        g.moveTo(cx+r*0.08, cy-r*0.95);
        g.quadraticCurveTo(cx+r*0.35, cy-r*1.15, cx+r*0.25, cy-r*0.8);
        g.stroke();
        break;
      }
      case 'cabbage': {
        fillEllipseDithered(g, cx, cy, r*0.82, r*0.82, tone);
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.045);
        g.beginPath(); g.arc(cx,cy,r*0.5,0,Math.PI*2); g.stroke();
        g.beginPath(); g.arc(cx,cy,r*0.22,0,Math.PI*2); g.stroke();
        g.fillStyle = PAL[1];
        for(let i=0;i<6;i++){
          const a2 = (i/6)*Math.PI*2;
          const bx = cx+Math.cos(a2)*r*0.78, by = cy+Math.sin(a2)*r*0.78;
          g.beginPath();
          g.arc(bx, by, r*0.16, 0, Math.PI*2);
          g.fill();
        }
        break;
      }
      case 'corn': {
        fillEllipseDithered(g, cx, cy, r*0.5, r*0.96, tone);
        g.fillStyle = PAL[0];
        for(let ry=-0.85; ry<=0.85; ry+=0.28){
          for(let rx=-0.35; rx<=0.35; rx+=0.32){
            g.beginPath();
            g.arc(cx+rx*r, cy+ry*r, r*0.065, 0, Math.PI*2);
            g.fill();
          }
        }
        g.fillStyle = PAL[1];
        g.beginPath();
        g.moveTo(cx-r*0.15, cy-r*0.95);
        g.quadraticCurveTo(cx-r*0.7, cy-r*1.1, cx-r*0.45, cy-r*1.55);
        g.quadraticCurveTo(cx-r*0.1, cy-r*1.25, cx-r*0.05, cy-r*0.9);
        g.fill();
        g.beginPath();
        g.moveTo(cx+r*0.15, cy-r*0.95);
        g.quadraticCurveTo(cx+r*0.7, cy-r*1.1, cx+r*0.45, cy-r*1.55);
        g.quadraticCurveTo(cx+r*0.1, cy-r*1.25, cx+r*0.05, cy-r*0.9);
        g.fill();
        break;
      }
      case 'giantpumpkin': {
        fillEllipseDithered(g, cx, cy, r*0.98, r*0.85, tone);
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.04);
        for(let k=-3;k<=3;k++){
          g.beginPath();
          g.ellipse(cx, cy, Math.abs(k)*r*0.14+r*0.08, r*0.83, 0, 0, Math.PI*2);
          g.stroke();
        }
        g.fillStyle = PAL[0];
        g.fillRect(cx-r*0.11, cy-r*1.05, r*0.22, r*0.32);
        g.fillStyle = PAL[1];
        g.beginPath();
        g.ellipse(cx+r*0.32, cy-r*0.98, r*0.24, r*0.14, -0.5, 0, Math.PI*2);
        g.fill();
        break;
      }
    }
    g.restore();
  }

  function render(){
    ctx.fillStyle = PAL[3];
    ctx.fillRect(0,0,W,H);

    // glass jar outline: straight walls, gently rounded bottom corners
    ctx.strokeStyle = PAL[0];
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(WALL_L, 0);
    ctx.lineTo(WALL_L, FLOOR-JAR_CORNER);
    ctx.quadraticCurveTo(WALL_L, FLOOR, WALL_L+JAR_CORNER, FLOOR);
    ctx.lineTo(WALL_R-JAR_CORNER, FLOOR);
    ctx.quadraticCurveTo(WALL_R, FLOOR, WALL_R, FLOOR-JAR_CORNER);
    ctx.lineTo(WALL_R, 0);
    ctx.stroke();

    // glass shine: a couple of pale streaks near the left wall
    ctx.strokeStyle = PAL[3];
    ctx.lineWidth = 3;
    ctx.setLineDash([10,14]);
    ctx.beginPath();
    ctx.moveTo(WALL_L+10, 14);
    ctx.lineTo(WALL_L+10, FLOOR-30);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(WALL_L+20, 14);
    ctx.lineTo(WALL_L+20, FLOOR-60);
    ctx.stroke();
    ctx.setLineDash([]);

    // game-over border line (always visible, like the real bottle's line)
    ctx.strokeStyle = dangerTimer > 15 ? '#c23616' : PAL[0];
    ctx.lineWidth = dangerTimer > 15 ? 3 : 2;
    ctx.setLineDash([5,4]);
    ctx.beginPath();
    ctx.moveTo(WALL_L, GAMEOVER_LINE);
    ctx.lineTo(WALL_R, GAMEOVER_LINE);
    ctx.stroke();
    ctx.setLineDash([]);

    // aim guide + drop preview
    if(!over){
      const r = TIERS[currentTier].r;
      ctx.strokeStyle = PAL[1];
      ctx.setLineDash([2,3]);
      ctx.beginPath();
      ctx.moveTo(dropX, DROP_Y+r);
      ctx.lineTo(dropX, FLOOR);
      ctx.stroke();
      ctx.setLineDash([]);
      if(canDrop){
        drawProduce(dropX, DROP_Y, r, currentTier);
      }
    }

    for(const b of bodies){
      drawProduce(b.x, b.y, TIERS[b.tier].r, b.tier, undefined, b.angle);
    }
  }

  function loop(){
    if(!over) step();
    render();
    requestAnimationFrame(loop);
  }

  resetGame();
  loop();
})();
</script>
