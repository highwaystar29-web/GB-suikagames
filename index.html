<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GB SUIKA</title>
<style>
  :root{
    --c0:#0f380f; /* darkest */
    --c1:#306230;
    --c2:#8bac0f;
    --c3:#9bbc0f; /* lightest */
  }
  html,body{
    margin:0; height:100%;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier New', 'Consolas', monospace;
    font-weight:bold;
    color:var(--c3);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
    overflow:hidden;
  }
  #shell{
    background:var(--c1);
    padding:18px;
    border-radius:14px;
    box-shadow:0 0 0 4px #1a1a1a, 0 10px 30px rgba(0,0,0,0.6);
    max-width:96vw;
    max-height:96vh;
    box-sizing:border-box;
  }
  #screen{
    background:var(--c3);
    border:6px solid var(--c0);
    border-radius:4px;
    position:relative;
    image-rendering:pixelated;
    overflow:hidden;
  }
  canvas{
    display:block;
    image-rendering:pixelated;
  }
  #game{
    max-width:100%;
    height:auto;
  }
  #hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 4px 12px 4px;
    font-size:9px;
    color:var(--c0);
  }
  #hud .box{
    background:var(--c2);
    border:2px solid var(--c0);
    padding:4px 6px;
    line-height:1.6;
  }
  #nextLabel{ text-align:right; }
  #overlay{
    position:absolute; inset:0;
    background:rgba(15,56,15,0.85);
    color:var(--c3);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:11px;
    gap:14px;
    padding:10px;
  }
  #overlay button{
    font-family:'Courier New', 'Consolas', monospace;
    font-weight:bold;
    background:var(--c2);
    color:var(--c0);
    border:3px solid var(--c0);
    padding:8px 14px;
    font-size:10px;
    cursor:pointer;
  }
  #overlay button:active{ transform:translateY(2px); }
  #hint{
    text-align:center;
    font-size:8px;
    color:var(--c0);
    opacity:0.7;
    margin-top:10px;
    letter-spacing:1px;
  }
</style>
</head>
<body>
<div id="shell">
  <div id="hud">
    <div class="box">SCORE<br><span id="scoreVal">0000</span></div>
    <div class="box" id="nextLabel">NEXT<br><canvas id="nextIcon" width="28" height="28" style="vertical-align:middle;image-rendering:pixelated;"></canvas></div>
  </div>
  <div id="screen">
    <canvas id="game" width="320" height="288"></canvas>
    <div id="overlay">
      <div>GAME OVER</div>
      <div id="finalScore" style="font-size:9px;"></div>
      <button id="retryBtn">RETRY</button>
    </div>
  </div>
  <div id="hint">HOLD TO AIM, RELEASE TO DROP<br>OR ←→ + SPACE</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('scoreVal');
  const nextIconCanvas = document.getElementById('nextIcon');
  const nextIconCtx = nextIconCanvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('finalScore');
  const retryBtn = document.getElementById('retryBtn');

  // ---- Game Boy palette (4 tones) ----
  const PAL = ['#0f380f','#306230','#8bac0f','#9bbc0f'];

  const ditherPatterns = [
    [[1,0],[0,0]],       // sparse
    [[1,0],[0,1]],       // checker
    [[1,1],[0,1]],       // dense
    [[1,1],[1,1]],       // solid
  ];

  // Tiers: radius growth + palette tone + shape id (produce theme, matches reference chart)
  const TIERS = [
    { r:8,  tone:0, name:'ドングリ',     shape:'acorn' },
    { r:11, tone:1, name:'栗',          shape:'chestnut' },
    { r:15, tone:0, name:'クルミ',       shape:'walnut' },
    { r:19, tone:2, name:'銀杏',        shape:'ginkgo' },
    { r:24, tone:1, name:'落花生',      shape:'peanut' },
    { r:30, tone:3, name:'さつまいも',   shape:'sweetpotato' },
    { r:37, tone:0, name:'じゃがいも',   shape:'potato' },
    { r:45, tone:2, name:'かぼちゃ',     shape:'pumpkin' },
    { r:54, tone:1, name:'キャベツ',     shape:'cabbage' },
    { r:64, tone:3, name:'とうもろこし', shape:'corn' },
    { r:76, tone:2, name:'巨大カボチャ', shape:'giantpumpkin' },
  ];

  const GRAVITY = 0.42;
  const WALL_L = 14, WALL_R = W-14, FLOOR = H-10;
  const DROP_Y = 30;
  const GAMEOVER_LINE = 40;

  let bodies = [];
  let score = 0;
  let dropX = W/2;
  let currentTier = 0;
  let nextTier = 0;
  let canDrop = true;
  let dropped = null;
  let over = false;
  let dangerTimer = 0;

  function randTier(){
    // early game favors small fruits
    return Math.floor(Math.random()*4);
  }

  function newFallingTier(){
    currentTier = nextTier;
    nextTier = randTier();
    drawNextIcon();
  }

  function drawNextIcon(){
    nextIconCtx.clearRect(0,0,28,28);
    const t = TIERS[nextTier];
    const scale = Math.min(1, 10/t.r);
    nextIconCtx.save();
    nextIconCtx.translate(14,15);
    nextIconCtx.scale(scale,scale);
    nextIconCtx.translate(-0,-0);
    drawProduce(0,0,t.r,nextTier,nextIconCtx);
    nextIconCtx.restore();
  }
  nextTier = randTier();
  newFallingTier();

  function addBody(x,y,tier,vy){
    bodies.push({
      x,y,tier,
      vx:0, vy: vy||0,
      settledFrames:0,
      id: Math.random()
    });
  }

  function resetGame(){
    bodies = [];
    score = 0;
    scoreEl.textContent = '0000';
    dropX = W/2;
    over = false;
    dangerTimer = 0;
    canDrop = true;
    dropped = null;
    nextTier = randTier();
    newFallingTier();
    overlay.style.display = 'none';
  }

  // ---- Input ----
  function pointerX(clientX){
    const rect = canvas.getBoundingClientRect();
    const scale = W / rect.width;
    return (clientX - rect.left) * scale;
  }

  let aiming = false;

  function startAim(x){
    if(!canDrop || over) return;
    aiming = true;
    dropX = clampDropX(x);
  }
  function updateAim(x){
    if(!aiming) return;
    dropX = clampDropX(x);
  }
  function releaseAim(){
    if(!aiming) return;
    aiming = false;
    doDrop();
  }

  canvas.addEventListener('mousedown', e=>{
    startAim(pointerX(e.clientX));
  });
  window.addEventListener('mousemove', e=>{
    updateAim(pointerX(e.clientX));
  });
  window.addEventListener('mouseup', ()=>{
    releaseAim();
  });

  canvas.addEventListener('touchstart', e=>{
    const t = e.touches && e.touches[0];
    if(!t) return;
    startAim(pointerX(t.clientX));
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchmove', e=>{
    const t = e.touches && e.touches[0];
    if(!t) return;
    updateAim(pointerX(t.clientX));
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchend', e=>{
    releaseAim();
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchcancel', e=>{
    aiming = false;
  });

  window.addEventListener('keydown', e=>{
    if(over) return;
    if(e.key==='ArrowLeft') dropX = clampDropX(dropX-8);
    if(e.key==='ArrowRight') dropX = clampDropX(dropX+8);
    if(e.key===' '||e.key==='ArrowDown') doDrop();
  });

  retryBtn.addEventListener('click', resetGame);

  function clampDropX(x){
    const r = TIERS[currentTier].r;
    return Math.max(WALL_L+r, Math.min(WALL_R-r, x));
  }

  function doDrop(){
    if(!canDrop || over) return;
    canDrop = false;
    addBody(dropX, DROP_Y, currentTier, 0);
    dropped = bodies[bodies.length-1];
    setTimeout(()=>{
      canDrop = true;
      dropped = null;
      newFallingTier();
    }, 480);
  }

  // ---- Physics ----
  function step(){
    for(const b of bodies){
      b.vy += GRAVITY;
      b.vy *= 0.98;
      b.vx *= 0.82;
      b.x += b.vx;
      b.y += b.vy;

      const r = TIERS[b.tier].r;
      if(b.x - r < WALL_L){ b.x = WALL_L+r; b.vx *= -0.08; }
      if(b.x + r > WALL_R){ b.x = WALL_R-r; b.vx *= -0.08; }
      if(b.y + r > FLOOR){
        b.y = FLOOR-r;
        b.vy *= -0.05;
        if(Math.abs(b.vy)<1.0) b.vy=0;
      }
      if(Math.abs(b.vx)<0.06) b.vx = 0;
      if(Math.abs(b.vy)<0.06) b.vy = 0;
    }

    // collision resolution, several gentle passes (soft correction to avoid overshoot/jitter)
    for(let pass=0; pass<3; pass++){
      for(let i=0;i<bodies.length;i++){
        for(let j=i+1;j<bodies.length;j++){
          const a = bodies[i], b = bodies[j];
          if(!a||!b) continue;
          const ra = TIERS[a.tier].r, rb = TIERS[b.tier].r;
          const dx = b.x-a.x, dy = b.y-a.y;
          const dist = Math.sqrt(dx*dx+dy*dy) || 0.0001;
          const minDist = ra+rb;
          if(dist < minDist){
            if(a.tier === b.tier && a.merging===undefined && b.merging===undefined && pass===0){
              mergePair(a,b,dist,minDist);
              continue;
            }
            const overlap = (minDist - dist);
            const nx = dx/dist, ny = dy/dist;
            const push = overlap*0.35; // partial correction, spread over passes/frames
            a.x -= nx*push; a.y -= ny*push;
            b.x += nx*push; b.y += ny*push;
            const relvx = b.vx-a.vx, relvy = b.vy-a.vy;
            const rel = relvx*nx+relvy*ny;
            if(rel < 0){
              const bounce = 0.02;
              a.vx -= nx*rel*bounce; a.vy -= ny*rel*bounce;
              b.vx += nx*rel*bounce; b.vy += ny*rel*bounce;
            }
            // strong damping on contact to kill jitter/oscillation
            a.vx *= 0.8; b.vx *= 0.8;
            a.vy *= 0.9; b.vy *= 0.9;
          }
        }
      }
    }

    bodies = bodies.filter(b=>!b.dead);

    // game over check: something resting near top for a while
    let danger = false;
    for(const b of bodies){
      const r = TIERS[b.tier].r;
      if(b.y - r < GAMEOVER_LINE && Math.abs(b.vy) < 1.2){
        danger = true;
        break;
      }
    }
    if(danger){
      dangerTimer++;
      if(dangerTimer > 50) triggerGameOver();
    } else {
      dangerTimer = Math.max(0, dangerTimer-2);
    }
  }

  const mergeQueue = [];
  function mergePair(a,b,dist,minDist){
    a.merging = true; b.merging = true;
    mergeQueue.push({a,b});
  }

  function processMerges(){
    for(const m of mergeQueue){
      const {a,b} = m;
      if(a.dead || b.dead) continue;
      const nextTierIdx = Math.min(a.tier+1, TIERS.length-1);
      const grew = a.tier < TIERS.length-1;
      a.dead = true; b.dead = true;
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      if(grew){
        addBody(mx, my, nextTierIdx, -2);
        score += (nextTierIdx+1)*10;
      } else {
        score += 100;
      }
      scoreEl.textContent = String(score).padStart(4,'0');
    }
    mergeQueue.length = 0;
    bodies = bodies.filter(b=>!b.dead);
  }

  function triggerGameOver(){
    over = true;
    finalScoreEl.textContent = 'SCORE ' + String(score).padStart(4,'0');
    overlay.style.display = 'flex';
  }

  // ---- Rendering (dithered GB style) ----
  // ---- generic dithered fillers (GB-style 2px cross-hatch shading) ----
  function fillEllipseDithered(g,cx,cy,rx,ry,tone){
    const pattern = ditherPatterns[tone];
    const dark = PAL[Math.max(0,tone-1)];
    const light = PAL[tone];
    g.save();
    g.beginPath();
    g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    g.clip();
    g.fillStyle = light;
    g.fillRect(cx-rx,cy-ry,rx*2,ry*2);
    g.fillStyle = dark;
    const step = 2;
    for(let y=-ry;y<ry;y+=step){
      for(let x=-rx;x<rx;x+=step){
        const px = Math.floor((x+rx)/step)%2;
        const py = Math.floor((y+ry)/step)%2;
        if(pattern[py][px]) g.fillRect(cx+x,cy+y,step,step);
      }
    }
    g.restore();
    g.strokeStyle = PAL[0];
    g.lineWidth = Math.max(1, Math.min(rx,ry)*0.08);
    g.beginPath();
    g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    g.stroke();
  }

  function fillPathDithered(g,tone,pathFn,bx,by,bw,bh){
    const pattern = ditherPatterns[tone];
    const dark = PAL[Math.max(0,tone-1)];
    const light = PAL[tone];
    g.save();
    pathFn();
    g.clip();
    g.fillStyle = light;
    g.fillRect(bx,by,bw,bh);
    g.fillStyle = dark;
    const step = 2;
    for(let y=by;y<by+bh;y+=step){
      for(let x=bx;x<bx+bw;x+=step){
        const px = Math.floor((x-bx)/step)%2;
        const py = Math.floor((y-by)/step)%2;
        if(pattern[py][px]) g.fillRect(x,y,step,step);
      }
    }
    g.restore();
    g.strokeStyle = PAL[0];
    g.lineWidth = Math.max(1, bw*0.045);
    pathFn();
    g.stroke();
  }

  function drawDitheredCircle(cx,cy,r,tone,g){
    g = g || ctx;
    fillEllipseDithered(g,cx,cy,r,r,tone);
  }

  // draws a produce-themed sprite whose SILHOUETTE (not just a plain circle)
  // matches the reference illustration, shaded with the 4-tone GB dither.
  function drawProduce(cx,cy,r,tier,g){
    g = g || ctx;
    const t = TIERS[tier];
    const tone = t.tone;

    switch(t.shape){
      case 'acorn': {
        fillEllipseDithered(g, cx, cy+r*0.2, r*0.68, r*0.78, tone);
        g.fillStyle = PAL[0];
        g.beginPath();
        g.ellipse(cx, cy-r*0.52, r*0.8, r*0.44, 0, 0, Math.PI*2);
        g.fill();
        g.strokeStyle = PAL[1];
        g.lineWidth = Math.max(1, r*0.06);
        for(let i=-2;i<=2;i++){
          g.beginPath();
          g.moveTo(cx+i*r*0.16, cy-r*0.78);
          g.lineTo(cx+i*r*0.16, cy-r*0.36);
          g.stroke();
        }
        g.fillStyle = PAL[0];
        g.fillRect(cx-r*0.07, cy-r*1.02, r*0.14, r*0.24);
        g.fillStyle = PAL[3];
        g.beginPath();
        g.ellipse(cx-r*0.2, cy+r*0.1, r*0.16, r*0.24, -0.4, 0, Math.PI*2);
        g.fill();
        break;
      }
      case 'chestnut': {
        fillEllipseDithered(g, cx, cy+r*0.08, r*0.72, r*0.85, tone);
        g.fillStyle = PAL[3];
        g.beginPath();
        g.ellipse(cx, cy-r*0.55, r*0.26, r*0.18, 0, 0, Math.PI*2);
        g.fill();
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.05);
        g.stroke();
        break;
      }
      case 'walnut': {
        fillEllipseDithered(g, cx, cy, r*0.88, r*0.88, tone);
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.09);
        g.beginPath();
        g.moveTo(cx, cy-r*0.8);
        g.quadraticCurveTo(cx-r*0.28, cy-r*0.28, cx, cy);
        g.quadraticCurveTo(cx+r*0.28, cy+r*0.28, cx, cy+r*0.8);
        g.stroke();
        g.lineWidth = Math.max(1, r*0.06);
        [[-0.4,-0.35,-0.12,-0.15],[0.4,-0.35,0.12,-0.15],[-0.4,0.35,-0.12,0.15],[0.4,0.35,0.12,0.15]].forEach(([x1,y1,x2,y2])=>{
          g.beginPath();
          g.moveTo(cx+x1*r, cy+y1*r);
          g.lineTo(cx+x2*r, cy+y2*r);
          g.stroke();
        });
        break;
      }
      case 'ginkgo': {
        const pathFn = ()=>{
          g.beginPath();
          g.moveTo(cx, cy-r*0.95);
          g.quadraticCurveTo(cx+r*0.6, cy-r*0.45, cx+r*0.4, cy+r*0.55);
          g.quadraticCurveTo(cx, cy+r*0.95, cx-r*0.4, cy+r*0.55);
          g.quadraticCurveTo(cx-r*0.6, cy-r*0.45, cx, cy-r*0.95);
          g.closePath();
        };
        fillPathDithered(g, tone, pathFn, cx-r, cy-r, r*2, r*2);
        g.strokeStyle = PAL[1];
        g.lineWidth = Math.max(1, r*0.05);
        g.beginPath();
        g.moveTo(cx, cy-r*0.7);
        g.lineTo(cx, cy+r*0.7);
        g.stroke();
        break;
      }
      case 'peanut': {
        fillEllipseDithered(g, cx, cy-r*0.42, r*0.55, r*0.58, tone);
        fillEllipseDithered(g, cx, cy+r*0.42, r*0.55, r*0.58, tone);
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.1);
        g.beginPath();
        g.moveTo(cx-r*0.32, cy-r*0.06);
        g.quadraticCurveTo(cx, cy-r*0.18, cx+r*0.32, cy-r*0.06);
        g.moveTo(cx-r*0.32, cy+r*0.06);
        g.quadraticCurveTo(cx, cy+r*0.18, cx+r*0.32, cy+r*0.06);
        g.stroke();
        g.fillStyle = PAL[0];
        [[-0.28,-0.55],[0.28,-0.55],[-0.28,0.55],[0.28,0.55]].forEach(([ox,oy])=>{
          g.beginPath();
          g.arc(cx+ox*r, cy+oy*r, r*0.07, 0, Math.PI*2);
          g.fill();
        });
        break;
      }
      case 'sweetpotato': {
        const ang = 0.35;
        const pathFn = ()=>{
          g.beginPath();
          g.ellipse(cx, cy, r*0.5, r*1.0, ang, 0, Math.PI*2);
        };
        fillPathDithered(g, tone, pathFn, cx-r, cy-r, r*2, r*2);
        g.fillStyle = PAL[0];
        [[-0.15,-0.45],[0.22,0.15],[-0.05,0.5]].forEach(([ox,oy])=>{
          g.beginPath();
          g.ellipse(cx+ox*r, cy+oy*r, r*0.12, r*0.06, ang, 0, Math.PI*2);
          g.fill();
        });
        g.fillStyle = PAL[3];
        g.beginPath();
        g.ellipse(cx-r*0.18, cy-r*0.35, r*0.1, r*0.28, ang, 0, Math.PI*2);
        g.fill();
        break;
      }
      case 'potato': {
        const pathFn = ()=>{
          g.beginPath();
          g.ellipse(cx, cy, r*0.85, r*0.72, 0.15, 0, Math.PI*2);
        };
        fillPathDithered(g, tone, pathFn, cx-r, cy-r, r*2, r*2);
        g.fillStyle = PAL[0];
        [[-0.3,-0.2],[0.2,0.1],[-0.05,0.35],[0.35,-0.25]].forEach(([ox,oy])=>{
          g.beginPath();
          g.arc(cx+ox*r, cy+oy*r, r*0.08, 0, Math.PI*2);
          g.fill();
        });
        break;
      }
      case 'pumpkin': {
        fillEllipseDithered(g, cx, cy, r*1.05, r*0.85, tone);
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.05);
        for(let k=-2;k<=2;k++){
          g.beginPath();
          g.ellipse(cx, cy, Math.abs(k)*r*0.16+r*0.1, r*0.83, 0, 0, Math.PI*2);
          g.stroke();
        }
        g.fillStyle = PAL[0];
        g.fillRect(cx-r*0.08, cy-r*1.0, r*0.16, r*0.28);
        g.strokeStyle = PAL[1];
        g.lineWidth = Math.max(1, r*0.06);
        g.beginPath();
        g.moveTo(cx+r*0.08, cy-r*0.95);
        g.quadraticCurveTo(cx+r*0.35, cy-r*1.15, cx+r*0.25, cy-r*0.8);
        g.stroke();
        break;
      }
      case 'cabbage': {
        fillEllipseDithered(g, cx, cy, r*0.82, r*0.82, tone);
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.045);
        g.beginPath(); g.arc(cx,cy,r*0.5,0,Math.PI*2); g.stroke();
        g.beginPath(); g.arc(cx,cy,r*0.22,0,Math.PI*2); g.stroke();
        g.fillStyle = PAL[1];
        for(let i=0;i<6;i++){
          const ang = (i/6)*Math.PI*2;
          const bx = cx+Math.cos(ang)*r*0.78, by = cy+Math.sin(ang)*r*0.78;
          g.beginPath();
          g.arc(bx, by, r*0.16, 0, Math.PI*2);
          g.fill();
        }
        break;
      }
      case 'corn': {
        fillEllipseDithered(g, cx, cy, r*0.52, r*1.05, tone);
        g.fillStyle = PAL[0];
        for(let ry=-0.85; ry<=0.85; ry+=0.28){
          for(let rx=-0.35; rx<=0.35; rx+=0.32){
            g.beginPath();
            g.arc(cx+rx*r, cy+ry*r, r*0.065, 0, Math.PI*2);
            g.fill();
          }
        }
        g.fillStyle = PAL[1];
        g.beginPath();
        g.moveTo(cx-r*0.15, cy-r*0.95);
        g.quadraticCurveTo(cx-r*0.7, cy-r*1.1, cx-r*0.45, cy-r*1.55);
        g.quadraticCurveTo(cx-r*0.1, cy-r*1.25, cx-r*0.05, cy-r*0.9);
        g.fill();
        g.beginPath();
        g.moveTo(cx+r*0.15, cy-r*0.95);
        g.quadraticCurveTo(cx+r*0.7, cy-r*1.1, cx+r*0.45, cy-r*1.55);
        g.quadraticCurveTo(cx+r*0.1, cy-r*1.25, cx+r*0.05, cy-r*0.9);
        g.fill();
        break;
      }
      case 'giantpumpkin': {
        fillEllipseDithered(g, cx, cy, r*1.1, r*0.88, tone);
        g.strokeStyle = PAL[0];
        g.lineWidth = Math.max(1, r*0.04);
        for(let k=-3;k<=3;k++){
          g.beginPath();
          g.ellipse(cx, cy, Math.abs(k)*r*0.14+r*0.08, r*0.86, 0, 0, Math.PI*2);
          g.stroke();
        }
        g.fillStyle = PAL[0];
        g.fillRect(cx-r*0.11, cy-r*1.05, r*0.22, r*0.32);
        g.fillStyle = PAL[1];
        g.beginPath();
        g.ellipse(cx+r*0.32, cy-r*0.98, r*0.24, r*0.14, -0.5, 0, Math.PI*2);
        g.fill();
        break;
      }
    }
  }

  function render(){
    ctx.fillStyle = PAL[3];
    ctx.fillRect(0,0,W,H);

    // container walls
    ctx.strokeStyle = PAL[0];
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(WALL_L, 0); ctx.lineTo(WALL_L, FLOOR);
    ctx.lineTo(WALL_R, FLOOR); ctx.lineTo(WALL_R, 0);
    ctx.stroke();

    // game-over border line (always visible, like the real bottle's line)
    ctx.strokeStyle = dangerTimer > 15 ? '#c23616' : PAL[0];
    ctx.lineWidth = dangerTimer > 15 ? 3 : 2;
    ctx.setLineDash([5,4]);
    ctx.beginPath();
    ctx.moveTo(WALL_L, GAMEOVER_LINE);
    ctx.lineTo(WALL_R, GAMEOVER_LINE);
    ctx.stroke();
    ctx.setLineDash([]);

    // aim guide + falling-preview fruit
    if(!over){
      const r = TIERS[currentTier].r;
      ctx.strokeStyle = PAL[1];
      ctx.setLineDash([2,3]);
      ctx.beginPath();
      ctx.moveTo(dropX, DROP_Y+r);
      ctx.lineTo(dropX, FLOOR);
      ctx.stroke();
      ctx.setLineDash([]);
      if(canDrop){
        drawProduce(dropX, DROP_Y, r, currentTier);
      }
    }

    for(const b of bodies){
      drawProduce(b.x, b.y, TIERS[b.tier].r, b.tier);
    }
  }

  function loop(){
    if(!over){
      step();
      processMerges();
    }
    render();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
